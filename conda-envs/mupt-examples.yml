# One environment for every notebook outside legacy/ (representation/,
# interfaces/, workflows/, analysis/). Per-section environments are smaller:
# representation.yml (representation/ + interfaces/) and workflows.yml.
name: mupt-examples
channels:
  - conda-forge
dependencies:
  - python>=3.12,<3.14
  - pip
  - jupyterlab
  - ipykernel
  - ipympl

  # MuPT runtime dependencies
  - numpy>=2.0
  - scipy>=1.16.0  # RigidTransform
  - sympy
  - rich
  - anytree
  - networkx
  - periodictable
  - rdkit

  # Plotting and visualization
  - matplotlib
  - pygraphviz
  - py3Dmol
  - nglview

  # flowerMD and its simulation stack (HOOMD + MoSDeF)
  - hoomd>=5.0,!=5.3.0
  - gsd>=3.0,<5
  - freud>=3.4
  - fresnel>=0.13.5
  - mbuild>=1.0
  - gmso>=0.16.2
  - foyer>=1.0
  - grits>=0.5.1
  - cmeutils>=1.3
  - openbabel>=3
  - unyt

  # MD input files (OpenFF Interchange -> GROMACS/LAMMPS/OpenMM) and analysis
  - openff-toolkit-base
  - openff-interchange-base
  - openff-forcefields
  - openmm
  - mdanalysis
  - mdtraj

  # Notebook tests
  - pytest
  - nbval

  - pip:
      # Refactored MuPT API (open PR stack, top branch incl. mupt#166).
      # Switch to the release tag once the stack merges into main.
      - mupt @ git+https://github.com/MuPT-hub/mupt.git@interfaces-mbuild-positions
      # flowerMD is not on PyPI; install from main (includes AA-DPD, cmelab/flowerMD#273)
      - flowermd @ git+https://github.com/cmelab/flowerMD.git
